<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
:root{--cream:#F3F2EA;--sand:#D9D9C5;--taupe:#46493A;--cocoa:#30342A;--espresso:#1A1C16;--gold:#5E7D3E;--gold-soft:#D8C27A}
.band{background:#33452B!important}
#page{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--cream);padding:44px 44px 0}
.photo{height:880px;background:url(../img/pasos.jpg) center 88%/cover;position:relative}
.photo .seal{position:absolute;left:28px;top:26px;background:rgba(246,240,231,.94);padding:12px 20px;font-family:"Cormorant";font-size:26px;font-weight:500;color:var(--espresso)}
.photo .seal b{font-weight:500;font-style:italic}
.txt{text-align:center;padding-top:22px}
.eyebrow{font-size:15px;font-weight:500;color:var(--gold);letter-spacing:.5em}
h1{font-family:"Cormorant";font-weight:500;font-size:80px;line-height:1;margin:4px 0 0;color:var(--espresso)}
h1 i{color:var(--gold)}
.tag{font-family:"Cormorant";font-style:italic;font-weight:500;font-size:30px;color:var(--cocoa)}
.stones{margin-top:12px;font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--cocoa)}
.stones b{color:var(--gold);font-weight:500;margin:0 8px}
.durs{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:16px;border-top:1.5px solid var(--gold);}
.durs>div{padding:12px 0 0}
.durs>div+div{border-left:1px solid #D5D8C2}
.durs .n{font-family:"Cormorant";font-style:italic;font-weight:600;font-size:36px;color:var(--espresso);line-height:1}
.durs .m{font-size:14px;font-weight:500;letter-spacing:.3em;color:var(--cocoa);margin-top:4px}
.durs .p{font-family:"Cormorant";font-weight:600;font-size:34px;color:var(--gold);margin-top:2px}
.pnote{margin-top:12px;font-size:15px;font-weight:500;letter-spacing:.06em;color:var(--cocoa)}
.pnote b{color:var(--espresso);font-weight:600}
.row1{margin-top:18px;border-top:1.5px solid var(--gold);padding-top:16px;display:flex;justify-content:center;align-items:center;gap:34px}
.m1{font-size:16px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.p1{font-family:"Cormorant";font-weight:700;font-size:62px;line-height:1;color:var(--espresso)}
.t1{border-left:1.5px solid var(--gold);padding-left:30px;text-align:left;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.t1 b{font-family:"Cormorant";font-size:30px;letter-spacing:0;text-transform:none;color:var(--espresso)}
</style></head><body>
<div id="page">
  <div class="photo"><div class="seal">VS <b>Estética</b></div></div>
  <div class="txt">
    <div class="eyebrow">★★★★★ &nbsp;Ritual de pies</div>
    <h1>Pasos <i>ligeros</i></h1>
    <div class="tag">Tus pies te sostienen cada día. Hoy déjalos descansar.</div>
    <div class="stones">Baño de pies<b>·</b>Reflexología<b>·</b>Toallas calientes<b>·</b>443 Hz</div>
    <div class="row1"><div class="m1">60 min</div><div class="p1">70 €</div><div class="t1">Reserva tu cita<br><b>Tel. 667 435 149</b></div></div>
  </div>
</div></body></html>
