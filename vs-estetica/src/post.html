<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
#page{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--espresso)}
.photo{position:absolute;inset:0;background:url(../img/hero.jpg) center 62%/cover}
.veil{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(246,240,231,.92) 0%,rgba(246,240,231,.70) 17%,rgba(246,240,231,0) 34%),
  linear-gradient(0deg,rgba(28,21,15,.95) 0%,rgba(28,21,15,.82) 24%,rgba(28,21,15,.35) 38%,rgba(28,21,15,0) 50%)}
.top{position:absolute;top:62px;left:0;right:0;text-align:center}
.top .eyebrow{font-size:17px;color:var(--cocoa)}
.top h1{font-family:"Cormorant";font-weight:400;font-size:118px;line-height:1;letter-spacing:.14em;color:var(--espresso);margin:20px 0 6px;padding-left:.14em}
.top h1 span{color:var(--gold)}
.top .tag{font-family:"Cormorant";font-style:italic;font-size:40px;color:var(--cocoa)}
.bottom{position:absolute;left:80px;right:80px;bottom:62px;color:var(--cream);text-align:center}
.bottom .stars{font-size:26px}
.bottom .promise{font-family:"Cormorant";font-weight:400;font-size:44px;line-height:1.18;margin:16px 0 30px}
.bottom .promise i{color:var(--gold-soft)}
.durs{display:flex;justify-content:center;gap:0;border-top:1px solid rgba(210,181,135,.5);border-bottom:1px solid rgba(210,181,135,.5);padding:18px 0}
.durs div{flex:1;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:var(--sand)}
.durs div+div{border-left:1px solid rgba(210,181,135,.35)}
.durs b{display:block;font-family:"Cormorant";font-style:italic;font-weight:400;font-size:34px;letter-spacing:.02em;text-transform:none;color:var(--cream);margin-bottom:4px}
.sign{margin-top:28px;font-size:16px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold-soft)}
</style></head><body>
<div id="page">
  <div class="photo"></div><div class="veil"></div>
  <div class="top">
    <div class="eyebrow">VS Estética · Ritual de autor</div>
    <h1>ÁUREA<span>.</span></h1>
    <div class="tag">Detén el tiempo. Respira. Vuelve a ti.</div>
  </div>
  <div class="bottom">
    <div class="stars">★★★★★</div>
    <div class="promise">El lujo de parar<br>y <i>dejarte cuidar.</i></div>
    <div class="durs">
      <div><b>Pausa</b>60 min</div>
      <div><b>Equilibrio</b>90 min</div>
      <div><b>Renacer</b>120 min</div>
    </div>
    <div class="sign">Reserva tu ritual</div>
  </div>
</div></body></html>
