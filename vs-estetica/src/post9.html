<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
:root{--cream:#F2F1EE;--cocoa:#2E343A;--espresso:#171B1F;--gold:#46647A}
#page{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--cream);padding:44px 44px 0}
.photo{height:960px;background:url(../img/descontracturante.jpg) center 30%/cover;position:relative}
.seal{position:absolute;left:28px;top:26px;background:rgba(245,240,234,.95);padding:12px 20px;font-family:"Cormorant";font-size:26px;font-weight:500;color:var(--espresso)}
.seal b{font-weight:500;font-style:italic}
.txt{text-align:center;padding-top:22px}
.eyebrow{font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.5em}
h1{font-family:"Cormorant";font-weight:500;font-size:72px;line-height:1;margin:4px 0 4px;color:var(--espresso)}
h1 i{color:var(--gold)}
.q{font-family:"Cormorant";font-style:italic;font-weight:600;font-size:29px;color:var(--cocoa)}
.row{margin-top:20px;border-top:1.5px solid var(--gold);padding-top:16px;display:flex;justify-content:center;align-items:center;gap:36px}
.num{font-family:"Cormorant";font-weight:600;font-size:64px;line-height:1;color:var(--espresso)}
.cta{border-left:1.5px solid var(--gold);padding-left:36px;text-align:left}
.cta .r{font-size:15px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
.cta .tel{font-family:"Cormorant";font-size:32px;font-weight:700;color:var(--espresso)}
</style></head><body>
<div id="page">
  <div class="photo"><div class="seal">VS <b>Estética</b></div></div>
  <div class="txt">
    <div class="eyebrow">Trabajo muscular · Presión progresiva</div>
    <h1>Masaje <i>descontracturante</i></h1>
    <div class="q">Cuéntame dónde notas la sobrecarga. Empezamos por ahí.</div>
    <div class="row"><div class="num">55 €</div><div class="cta"><div class="r">Reserva tu cita</div><div class="tel">Tel. 667 435 149</div></div></div>
  </div>
</div></body></html>
