<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
:root{--cream:#F3EFF3;--sand:#DCD3E2;--taupe:#4E4560;--cocoa:#352E44;--espresso:#1C1826;--gold:#6B5590;--gold-soft:#CBBCE6}
#page{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--cream);padding:44px 44px 0}
.photo{height:965px;background:url(../img/nocturna.jpg) center 0%/cover;position:relative}
.photo .seal{position:absolute;left:28px;top:26px;background:rgba(246,240,231,.94);padding:12px 20px;font-family:"Cormorant";font-size:26px;font-weight:500;color:var(--espresso)}
.photo .seal b{font-weight:500;font-style:italic}
.txt{text-align:center;padding-top:16px}
.eyebrow{font-size:15px;font-weight:500;color:var(--gold);letter-spacing:.5em}
h1{font-family:"Cormorant";font-weight:500;font-size:70px;line-height:1;margin:2px 0 0;color:var(--espresso)}
h1 i{color:var(--gold)}
.tag{font-family:"Cormorant";font-style:italic;font-weight:500;font-size:27px;color:var(--cocoa)}
.stones{margin-top:8px;font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--cocoa)}
.stones b{color:var(--gold);font-weight:500;margin:0 8px}
.durs{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:12px;border-top:1.5px solid var(--gold);}
.durs>div{padding:9px 0 0}
.durs>div+div{border-left:1px solid #D6CBE0}
.durs .n{font-family:"Cormorant";font-style:italic;font-weight:600;font-size:31px;color:var(--espresso);line-height:1}
.durs .m{font-size:14px;font-weight:500;letter-spacing:.3em;color:var(--cocoa);margin-top:4px}
.durs .p{font-family:"Cormorant";font-weight:600;font-size:30px;color:var(--gold);margin-top:2px}
.pnote{margin-top:12px;font-size:15px;font-weight:500;letter-spacing:.06em;color:var(--cocoa)}
.pnote b{color:var(--espresso);font-weight:600}
</style></head><body>
<div id="page">
  <div class="photo"><div class="seal">VS <b>Estética</b></div></div>
  <div class="txt">
    <div class="eyebrow">★★★★★ &nbsp;Ritual de autor</div>
    <h1>Ritual <i>Nocturna</i></h1>
    <div class="tag">El día termina. Tu descanso comienza.</div>
    <div class="stones">Amatista<b>·</b>Lepidolita<b>·</b>Turmalina negra<b>·</b>Lavanda</div>
    <div class="durs">
      <div><div class="n">Calma</div><div class="m">60 MIN</div><div class="p">{P60}</div></div>
      <div><div class="n">Refugio</div><div class="m">90 MIN</div><div class="p">{P90}</div></div>
      <div><div class="n">Sueño profundo</div><div class="m">120 MIN</div><div class="p">{P120}</div></div>
    </div>
    <div class="pnote">Según la duración, se suman experiencias al ritual · Consultar · <b>Tel. 667 435 149</b></div>
  </div>
</div></body></html>
